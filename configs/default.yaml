# CoNTM Baseline — Default Configuration
# Based on hyperparameters from the paper (Section 4.2)

# ── Data ──
data_dir: "data/NIPS"     # path to preprocessed dataset

# ── Model ──
n_topics: 50              # number of topics K
enc_hidden: 256           # encoder hidden layer size (2 FC layers)
dropout: 0.2              # encoder input dropout

# ── Training ──
lr: 0.01                  # learning rate (Adam)
weight_decay: 1.0e-6      # L2 regularization
epochs: 100               # max epochs per timestamp
kl_warmup_epochs: 20      # linearly anneal KL weight from 0 to 1
patience: 10              # early stopping patience (on validation loss)
batch_size: 256           # mini-batch size
alpha: 0.90               # early stopping: alpha*val_loss + (1-alpha)*val_ppl
                          # (see paper Appendix L, Figures 19-20)

# ── Global Memory ──
kappa: 0.7                # κ — decay exponent for ρ_t = 1/(τ₀+t)^κ
tau0: 1.0                 # τ₀ — base offset for step size

# ── Evaluation ──
top_m: 15                 # top words per topic for display/diversity
npmi_top_n: 10            # top words per topic for NPMI coherence

# ── Output ──
output_dir: "outputs"     # directory for results, topics, global memory
seed: 42                  # random seed
device: "auto"            # "cpu", "cuda", or "auto"
